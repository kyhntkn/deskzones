name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Sürümü belirle
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v(\d+\.\d+\.\d+)') { $v = $Matches[1] } else { $v = '1.0.0' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Derle (tek dosya .exe)
        shell: pwsh
        run: >
          dotnet publish src/DeskZones/DeskZones.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: MSIX paketle
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}.0"
          New-Item -ItemType Directory -Force msix\Assets | Out-Null
          Copy-Item publish\DeskZones.exe msix\
          Copy-Item packaging\Assets\*.png msix\Assets\
          (Get-Content packaging\AppxManifest.xml -Raw) -replace 'VERSION_PLACEHOLDER', $v |
            Set-Content msix\AppxManifest.xml -Encoding UTF8
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter makeappx.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $makeappx.FullName pack /d msix /p DeskZones.msix /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx basarisiz" }

      - uses: actions/upload-artifact@v4
        with:
          name: DeskZones
          path: |
            publish/DeskZones.exe
            DeskZones.msix

      - name: Release oluştur
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/DeskZones.exe
            DeskZones.msix
